<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="entail-token" content="__ENTAIL_TOKEN__">
<title>entail</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <strong>entail</strong>
  <span class="sub">AI 프로젝트의 안정성 · stability of AI projects</span>
  <span id="folder" class="folder"></span>
  <span id="live" class="live" title="live">●</span>
</header>
<main>
  <aside id="runs">
    <h2>실행 <span class="en">Runs</span></h2>
    <ul id="runlist"></ul>
    <h2 class="gap">안전모드 <span class="en">Safe mode</span></h2>
    <select id="safemode" aria-label="안전모드 · safe mode">
      <option value="auto">자동: 선택적 안전 경로 (기본)</option>
      <option value="all">명시적 안전모드: 모두 끔</option>
      <option value="off">끔</option>
    </select>
    <div id="safenote" class="hint small"></div>
    <ul id="safepaths"></ul>
  </aside>
  <section id="center">
    <div id="banner" class="banner">기록을 읽는 중… <span class="en">reading records</span></div>
    <div id="flows"></div>
    <div id="legend" class="legend"></div>
  </section>
  <aside id="detail">
    <h2 id="dtitle">노드 <span class="en">Node</span></h2>
    <div id="dbody" class="hint">노드를 누르면 어디서, 왜가 여기에 나온다. <span class="en">Pick a node to see where and why.</span></div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
