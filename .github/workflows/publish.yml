name: publish

# Releases what a merged release pull request put on main (RELEASING.md). On every push to main it reads the version in
# entail/__init__.py; when that version has no tag yet, it builds and checks the wheel, publishes to PyPI once the
# researcher approves the deployment to the `pypi` environment (its required reviewer), then tags the commit, makes the
# GitHub release from the version's CHANGELOG section, installs the release from PyPI to try it (the uploaded wheel by
# its URL and sha256 when PyPI's index lags behind the upload), and says on each
# issue the release closes that its fix is released. A push that keeps a released version does nothing. PyPI trusts this workflow file and that environment (RELEASING.md): keep both names.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Is this version released yet?
        run: |
          version=$(python3 -c "import re; print(re.search(r'^__version__ = \"([0-9.]+)\"', open('entail/__init__.py').read(), re.M).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released: nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/release_notes.py "$version" > /dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release $version: it goes to PyPI once the researcher approves the deployment to \`pypi\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel installs, says its version and places the start-up hook
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install -q dist/*.whl
          test "$(/tmp/wheel/bin/python -c 'import entail; print(entail.__version__)')" = "$VERSION"
          /tmp/wheel/bin/entail hook status
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: pypi          # the researcher's approval: the job waits here until the deployment is approved
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    needs: [plan, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the commit and make the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 .github/scripts/release_notes.py "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "entail $VERSION" --notes-file notes.md

  announce:
    needs: [plan, release]
    runs-on: ubuntu-latest
    continue-on-error: true      # a comment that cannot be made never fails a release
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Say "released" on the issues this release closes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 .github/scripts/release_issues.py "$VERSION"

  verify:
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The upload is checked in the version's own JSON; pip installs from PyPI's index once it lists the version (up
      # to 20 minutes), else the uploaded wheel is checked by its URL and sha256, with a warning that the index was late
      - name: Install the release from PyPI and try it
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/verify_release.py "$VERSION"
