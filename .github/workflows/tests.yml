name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: CPU torch and the transformers version the adapters were measured against
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.17.0"
      - name: Install entail from this checkout (as a wheel, so the start-up hook is placed)
        run: python -m pip install .
      - name: Start-up hook is in place
        run: entail hook status
      - name: Example without and with entail
        run: |
          python examples/rope_scaling_restated.py | tee plain.txt
          grep -q "DROPPED" plain.txt
          ENTAIL=load python examples/rope_scaling_restated.py | tee on.txt
          grep -q "rope_theta kept" on.txt
      - name: Unit tests
        run: PYTHON=python bash tests/run_all.sh
